version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: logistics-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: i1112006s
      POSTGRES_DB: logistics
    ports:
      - "5432:5432"
    volumes:
      - logistics_pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: logistics-redis
    ports:
      - "6379:6379"
    volumes:
      - logistics_redisdata:/data
    restart: always

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: logistics-azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --debug /data/debug.log
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - logistics_azurite:/data
    restart: always

volumes:
  logistics_pgdata:
  logistics_redisdata:
  logistics_azurite: